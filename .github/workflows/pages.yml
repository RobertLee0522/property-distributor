name: 更新行情並發布網站

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 台灣時間週一至週五 08:00–18:45，每 15 分鐘更新一次。
    - cron: "*/15 0-10 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 讀取網站程式
        uses: actions/checkout@v4

      - name: 準備 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci --ignore-scripts

      - name: 取得最新行情
        run: node scripts/refresh-market-data.mjs

      - name: 建置 GitHub Pages 網站
        env:
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run build:github

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v4
